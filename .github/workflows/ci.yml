name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
  s3:
    name: S3-compatible artifact store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start an S3-compatible store
        run: |
          docker run -d --name s3 -p 9090:9090 -e initialBuckets=hinagata-test adobe/s3mock
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9090/ && break
            sleep 1
          done
      - name: Artifact tests against it
        run: cargo test --locked --test artifacts
        env:
          HINAGATA_REQUIRE_S3: "1"
          HINAGATA_TEST_S3_ENDPOINT: http://127.0.0.1:9090
          HINAGATA_TEST_S3_BUCKET: hinagata-test
          AWS_ACCESS_KEY_ID: testkey
          AWS_SECRET_ACCESS_KEY: testsecret123
          AWS_REGION: us-east-1
