name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
  s3:
    name: S3-compatible artifact store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Start an S3-compatible store
        run: |
          docker run -d --name s3 -p 9090:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=hinagata-test adobe/s3mock
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9090/ && break
            sleep 1
          done
          # Create the bucket too, in case the store ignores the setting.
          curl -s -X PUT http://127.0.0.1:9090/hinagata-test || true
          curl -sf -o /dev/null -I http://127.0.0.1:9090/hinagata-test
      - name: Artifact tests against it
        run: cargo test --locked --test artifacts
        env:
          HINAGATA_REQUIRE_S3: "1"
          HINAGATA_TEST_S3_ENDPOINT: http://127.0.0.1:9090
          HINAGATA_TEST_S3_BUCKET: hinagata-test
          AWS_ACCESS_KEY_ID: testkey
          AWS_SECRET_ACCESS_KEY: testsecret123
          AWS_REGION: us-east-1
  static-image:
    name: Static image without network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t hinagata:ci .
      - name: The binary is static
        run: |
          id=$(docker create hinagata:ci)
          docker cp "$id":/hinagata ./hinagata-static
          docker cp "$id":/etc/ssl/certs/ca-certificates.crt ./ca-certificates.crt
          docker rm "$id"
          test -s ca-certificates.crt
          file hinagata-static | tee /dev/stderr | grep -q "statically linked"
      - name: It serves with networking disabled
        run: |
          echo ci-token > token
          chmod 644 token
          docker run -d --name hinagata --network none \
            -v "$PWD/token:/run/token:ro" \
            -e HINAGATA_STATIC_TOKEN_FILE=/run/token -e HINAGATA_STATIC_NAMESPACE=ci \
            hinagata:ci
          # A probe that shares the server's network namespace, which has
          # only loopback.
          docker run --rm --network container:hinagata alpine sh -ec '
            for _ in $(seq 1 30); do wget -qO /dev/null http://127.0.0.1:7700/healthz && break; sleep 1; done
            wget -qO- http://127.0.0.1:7700/healthz | grep -q "\"ok\""
            wget -qO- --header "authorization: Bearer ci-token" http://127.0.0.1:7700/v1/identity | grep -q "\"ci\""
            wget -qO- http://127.0.0.1:7700/metrics | grep -q "hinagata_up 1"
            ! wget -q -T 3 -O /dev/null http://example.com'
          docker logs hinagata
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
