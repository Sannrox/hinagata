name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
  s3:
    name: S3-compatible artifact store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Start an S3-compatible store
        run: |
          docker run -d --name s3 -p 9090:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=hinagata-test adobe/s3mock
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9090/ && break
            sleep 1
          done
          # Create the bucket too, in case the store ignores the setting.
          curl -s -X PUT http://127.0.0.1:9090/hinagata-test || true
          curl -sf -o /dev/null -I http://127.0.0.1:9090/hinagata-test
      - name: Artifact tests against it
        run: cargo test --locked --test artifacts
        env:
          HINAGATA_REQUIRE_S3: "1"
          HINAGATA_TEST_S3_ENDPOINT: http://127.0.0.1:9090
          HINAGATA_TEST_S3_BUCKET: hinagata-test
          AWS_ACCESS_KEY_ID: testkey
          AWS_SECRET_ACCESS_KEY: testsecret123
          AWS_REGION: us-east-1
  static-image:
    name: Static image without network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t hinagata:ci .
      - name: The binary is static
        run: |
          id=$(docker create hinagata:ci)
          docker cp "$id":/hinagata ./hinagata-static
          docker cp "$id":/etc/ssl/certs/ca-certificates.crt ./ca-certificates.crt
          docker rm "$id"
          test -s ca-certificates.crt
          file hinagata-static | tee /dev/stderr | grep -qE "static(ally|-pie) linked"
      - name: It serves with networking disabled
        run: |
          echo ci-token > token
          chmod 644 token
          docker run -d --name hinagata --network none \
            -v "$PWD/token:/run/token:ro" \
            -e HINAGATA_STATIC_TOKEN_FILE=/run/token -e HINAGATA_STATIC_NAMESPACE=ci \
            hinagata:ci
          # A probe that shares the server's network namespace, which has
          # only loopback.
          docker run --rm --network container:hinagata alpine sh -ec '
            for _ in $(seq 1 30); do wget -qO /dev/null http://127.0.0.1:7700/healthz && break; sleep 1; done
            wget -qO- http://127.0.0.1:7700/healthz | grep -q "\"ok\""
            wget -qO- --header "authorization: Bearer ci-token" http://127.0.0.1:7700/v1/identity | grep -q "\"ci\""
            wget -qO- http://127.0.0.1:7700/metrics | grep -q "hinagata_up 1"
            ! wget -q -T 3 -O /dev/null http://example.com'
          docker logs hinagata
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/validate-workflow-skills.sh
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/validate-release.sh

  # Proto compatibility against the last final v* tag (proto/buf.yaml sets the
  # rules). A reported break passes only when the pull request is marked
  # breaking (`type!:` subject or a Breaking/Upgrade section, see
  # AGENTS.md) and labelled `risk:breaking`; a tool failure stays red.
  proto-breaking:
    name: Proto breaking
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - name: buf breaking
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$BASE" 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            echo "::notice::No final v* tag yet; nothing to compare against."
            exit 0
          fi
          if ! git cat-file -e "${tag}:proto" 2>/dev/null; then
            echo "::notice::${tag} has no proto/ directory; nothing to compare against."
            exit 0
          fi
          rc=0
          out="$(buf breaking proto --against ".git#tag=${tag},subdir=proto" --error-format github-actions 2>&1)" || rc=$?
          echo "$out"
          [[ $rc -eq 0 ]] && exit 0
          # buf exits 100 for reported incompatibilities; anything else is a tool error.
          if [[ $rc -ne 100 ]]; then
            echo "::error::buf breaking failed without reporting a break (exit ${rc}); see the log."
            exit "$rc"
          fi
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Proto break against ${tag} accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::buf breaking found incompatible proto changes against ${tag}. Mark the pull request breaking (a 'type!:' title or a '## Breaking' section) and add the risk:breaking label, or keep the change compatible."
          exit 1
