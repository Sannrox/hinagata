[package]
name = "hinagata"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Registry for classical ML models: versions, signatures, lineage, stages, deployment descriptors and drift monitoring."
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1.12.1"
ed25519-dalek = "2.2.0"
futures = "0.3.34"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
object_store = { version = "0.14.2", features = ["aws"] }
prost = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-connect-info", "tls-ring"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util"] }
