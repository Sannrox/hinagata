# License gate: the default build links no copyleft code. `cargo deny check
# licenses` fails on any dependency whose license is not on this list.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
