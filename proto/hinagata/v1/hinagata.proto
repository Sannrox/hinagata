// Hinagata API, version 1. gRPC is the primary surface; the same messages
// serve the HTTP/JSON surface. Requests never carry a namespace: it comes
// from the caller's credential alone.
syntax = "proto3";

package hinagata.v1;

service Hinagata {
  // The identity the caller's credential resolves to.
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);

  // Create a model in the caller's namespace. Creating it again with the
  // same description returns it unchanged.
  rpc CreateModel(CreateModelRequest) returns (Model);
  rpc GetModel(GetModelRequest) returns (Model);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // Register the next version of a model, in stage `candidate`. A version
  // never changes once registered. Registering the same artifact with the
  // same content returns the stored version; with other content it fails.
  rpc RegisterVersion(RegisterVersionRequest) returns (Version);
  rpc GetVersion(GetVersionRequest) returns (Version);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  // Versions trained on a dataset, optionally at one digest: the reverse of
  // a version's lineage.
  rpc ListVersionsTrainedOn(ListVersionsTrainedOnRequest) returns (ListVersionsResponse);

  // Move a version between stages: candidate and staging either way, and
  // either of them to archived, which is final. With an approval hook every
  // change applies only on its allow; without one, production is refused
  // (docs/promotion.md).
  rpc SetVersionStage(SetVersionStageRequest) returns (Version);
  // Gates a model requires for promotion to production: metric minimums,
  // signature compatibility with every version in production, and a signed
  // manifest. Checked before the approval hook is asked and again when the
  // change applies.
  rpc PutPromotionGates(PutPromotionGatesRequest) returns (PromotionGates);
  rpc GetPromotionGates(GetPromotionGatesRequest) returns (PromotionGates);

  // The changes from one version's signature to another's that break a
  // caller of the first: a new input, an input of another type or shape or
  // that no longer accepts null, a removed output or one of another type or
  // shape. Check before promoting the second.
  // A detached Ed25519 signature over the version's manifest: its
  // namespace, model, number, artifact digest and metadata digest (format in
  // docs/signatures.md). FAILED_PRECONDITION when the registry has no
  // signing key.
  rpc GetVersionManifest(GetVersionManifestRequest) returns (VersionManifest);
  // Admit a version exported from another registry (docs/bundles.md): its
  // signed manifest is checked against this registry's trusted keys and its
  // metadata against the manifest, before anything is written. The
  // artifact must already be stored in the caller's namespace and the model
  // must exist. It registers as the next version of the manifest's model,
  // and the source is audited as `version.imported`. With `validate_only`
  // only the signature and metadata are checked. FAILED_PRECONDITION when
  // the registry trusts no keys.
  rpc ImportVersion(ImportVersionRequest) returns (ImportVersionResponse);

  rpc CheckSignatureCompatibility(CheckSignatureCompatibilityRequest) returns (CheckSignatureCompatibilityResponse);

  // Artifacts are content-addressed bytes, stored once and read only by
  // namespaces that uploaded them. An upload begins with the digest and
  // size, takes chunks of up to 1 MiB at `received_bytes` (a resent chunk is
  // a no-op, so an interrupted upload resumes), and completes only when the
  // bytes hash to the digest. A version can only name a stored artifact.
  rpc BeginArtifactUpload(BeginArtifactUploadRequest) returns (ArtifactUploadStatus);
  rpc UploadArtifactChunk(UploadArtifactChunkRequest) returns (ArtifactUploadStatus);
  rpc CompleteArtifactUpload(CompleteArtifactUploadRequest) returns (ArtifactUploadStatus);
  // The artifact's bytes, after checking they still hash to the digest; a
  // corrupted artifact is refused with DATA_LOSS.
  rpc ReadArtifact(ReadArtifactRequest) returns (stream ArtifactChunk);

  // Drift monitoring. A version's training baseline gives each feature's
  // and output's bins; prediction summaries (format
  // `hinagata.prediction-summary/v1`, no raw rows) use exactly those bins.
  // Each summary gets PSI and binned KS per feature and output, and every
  // value at or above the version's thresholds is a drift alert.
  rpc PutDriftBaseline(PutDriftBaselineRequest) returns (PutDriftBaselineResponse);
  rpc SubmitPredictionSummary(SubmitPredictionSummaryRequest) returns (DriftReport);
  rpc ListDriftAlerts(ListDriftAlertsRequest) returns (ListDriftAlertsResponse);

  // Model quality. The caller joins labels to its own predictions and sends
  // labeled aggregates (format `hinagata.labeled-aggregate/v1`): confusion
  // counts and per-class score histograms, or error sums. Each gets
  // accuracy, AUC and calibration error, or MAE and RMSE, and every metric
  // past the version's thresholds is an alert with role `quality` in the
  // drift alert stream.
  rpc PutQualityThresholds(PutQualityThresholdsRequest) returns (PutQualityThresholdsResponse);
  rpc SubmitLabeledAggregate(SubmitLabeledAggregateRequest) returns (QualityReport);

  // Every change, oldest first, with its actor and the record before and
  // after.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

message GetIdentityRequest {}

message GetIdentityResponse {
  // The namespace every call by this caller acts in.
  string namespace = 1;
  // The credential's subject; empty when it names none.
  string subject = 2;
}

message Model {
  string name = 1;
  string description = 2;
  int64 created_at_ms = 3;
  // The subject of the credential that created it.
  string created_by = 4;
}

message CreateModelRequest {
  // 1 to 128 of `A-Z a-z 0-9 . _ -`, starting with a letter or digit.
  string name = 1;
  string description = 2;
}

message GetModelRequest {
  string name = 1;
}

message ListModelsRequest {
  // Names after this one, in name order.
  string after = 1;
  // Default 100, at most 1000.
  uint32 limit = 2;
}

message ListModelsResponse {
  repeated Model models = 1;
}

// One declared input or output.
message TensorSpec {
  string name = 1;
  string dtype = 2;
  // Dimensions; -1 is a dynamic dimension.
  repeated int64 shape = 3;
  bool nullable = 4;
}

message Signature {
  repeated TensorSpec inputs = 1;
  repeated TensorSpec outputs = 2;
}

message Version {
  string model = 1;
  // 1 for the first version of a model, then counting up.
  uint64 version = 2;
  // `sha256:<64 lowercase hex>` of the artifact in the artifact store.
  string artifact_digest = 3;
  string framework = 4;
  // `onnx`.
  string format = 5;
  Signature signature = 6;
  map<string, double> metrics = 7;
  map<string, string> tags = 8;
  // `candidate`, `staging`, `production` or `archived`.
  string stage = 9;
  int64 created_at_ms = 10;
  string created_by = 11;
  // What produced the version. Fixed at registration like the rest.
  Lineage lineage = 12;
  // The dataset schema or object type its inputs read from.
  SignatureBinding binding = 13;
}

message BindingField {
  string name = 1;
  // A signature dtype, such as int64 or float32.
  string dtype = 2;
  bool nullable = 3;
}

message InputFields {
  repeated string fields = 1;
}

// The target a version's inputs read from, given inline (Hinagata fetches
// nothing). Each input takes the field of its own name, or the fields listed
// under `inputs`: one for a [batch] input, n in order for a [batch, n] one.
// A field must widen to the input's type without loss, and a nullable field
// cannot feed an input that does not accept null.
message SignatureBinding {
  // `dataset` or `object_type`.
  string target_kind = 1;
  string target = 2;
  repeated BindingField fields = 3;
  map<string, InputFields> inputs = 4;
}

message CheckSignatureCompatibilityRequest {
  string model = 1;
  uint64 from_version = 2;
  uint64 to_version = 3;
}

message CheckSignatureCompatibilityResponse {
  bool compatible = 1;
  repeated string breaking = 2;
}

message DatasetVersion {
  string dataset_id = 1;
  // The dataset's version id; empty when the source names none.
  string version = 2;
  // `sha256:<64 lowercase hex>` of the data the training run read.
  string digest = 3;
}

message CodeReference {
  string repository = 1;
  // 7 to 64 hex characters.
  string commit = 2;
  // `sha256:<hex>` of the training code, as the run receipt records it.
  string digest = 3;
}

message Lineage {
  repeated DatasetVersion training_datasets = 1;
  CodeReference code = 2;
  map<string, string> parameters = 3;
  // The training run's id in the batch runner.
  string run_receipt_id = 4;
  // SHA-256 of the run receipt, when the version was registered from one.
  string run_receipt_digest = 5;
}

message RegisterVersionRequest {
  string model = 1;
  string artifact_digest = 2;
  string framework = 3;
  string format = 4;
  Signature signature = 5;
  map<string, double> metrics = 6;
  map<string, string> tags = 7;
  Lineage lineage = 8;
  // A batch runner training receipt (JSON, receipt schema 6). When set, its
  // inputs become the training datasets, its job id the run receipt id and
  // its code digest the code digest; `lineage` may add the repository,
  // commit and parameters but not datasets. The receipt must list
  // `artifact_digest` among its outputs.
  string training_run_receipt_json = 9;
  // Omit the signature of an ONNX artifact to read it from the model graph;
  // a given one must match the graph.
  SignatureBinding binding = 10;
}

message GetVersionRequest {
  string model = 1;
  uint64 version = 2;
}

message ListVersionsRequest {
  string model = 1;
  // Versions after this one, in version order.
  uint64 after = 2;
  uint32 limit = 3;
}

message ListVersionsResponse {
  repeated Version versions = 1;
}

message ListVersionsTrainedOnRequest {
  string dataset_id = 1;
  // Only this dataset digest, when set.
  string digest = 2;
  // Versions after (after_model, after_version), in that order.
  string after_model = 3;
  uint64 after_version = 4;
  uint32 limit = 5;
}

message SetVersionStageRequest {
  string model = 1;
  uint64 version = 2;
  string stage = 3;
  // When set, the change applies only while the version is still in this
  // stage.
  string expected_stage = 4;
}

message AuditEvent {
  uint64 seq = 1;
  int64 at_ms = 2;
  string actor = 3;
  // `model.created`, `version.registered` or `version.stage_changed`.
  string action = 4;
  string model = 5;
  // Zero for model events.
  uint64 version = 6;
  // JSON of the record before and after; empty before a creation.
  string before = 7;
  string after = 8;
}

message ListAuditEventsRequest {
  // Only this model's events, when set.
  string model = 1;
  // Events after this sequence number.
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
}

message BeginArtifactUploadRequest {
  // `sha256:<64 lowercase hex>`.
  string digest = 1;
  // At most the server's artifact limit.
  uint64 size_bytes = 2;
}

message ArtifactUploadStatus {
  string upload_id = 1;
  string digest = 2;
  uint64 size_bytes = 3;
  // Send the next chunk from here.
  uint64 received_bytes = 4;
  // The artifact is stored for the caller's namespace.
  bool complete = 5;
}

message UploadArtifactChunkRequest {
  string upload_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message CompleteArtifactUploadRequest {
  string upload_id = 1;
}

message ReadArtifactRequest {
  string digest = 1;
}

message ArtifactChunk {
  bytes data = 1;
}

// `n` ascending edges give `n + 1` bins: below the first edge, between each
// pair (lower edge inclusive), and at or above the last.
message NumericBins {
  repeated double edges = 1;
  repeated uint64 counts = 2;
}

message CategoryCounts {
  map<string, uint64> counts = 1;
}

message Distribution {
  oneof bins {
    NumericBins numeric = 1;
    CategoryCounts categorical = 2;
  }
}

message DriftBaseline {
  map<string, Distribution> features = 1;
  map<string, Distribution> outputs = 2;
}

// A value at or above a threshold alerts; an unset threshold never does.
message DriftThresholds {
  optional double psi = 1;
  // At most 1.
  optional double ks = 2;
}

message PutDriftBaselineRequest {
  string model = 1;
  uint64 version = 2;
  // Fixed once set; setting the same baseline again may change thresholds.
  DriftBaseline baseline = 3;
  DriftThresholds thresholds = 4;
}

message PutDriftBaselineResponse {}

message PredictionSummary {
  // `hinagata.prediction-summary/v1`.
  string format = 1;
  // Unique per version; sending the same summary again is a no-op.
  string summary_id = 2;
  int64 window_start_ms = 3;
  int64 window_end_ms = 4;
  uint64 prediction_count = 5;
  double latency_p50_ms = 6;
  double latency_p95_ms = 7;
  // Counts in the baseline's bins, for every baseline feature and output.
  map<string, Distribution> features = 8;
  map<string, Distribution> outputs = 9;
}

message SubmitPredictionSummaryRequest {
  string model = 1;
  uint64 version = 2;
  PredictionSummary summary = 3;
}

message FeatureDrift {
  // `feature` or `output`.
  string role = 1;
  string name = 2;
  double psi = 3;
  // Unset for categorical distributions.
  optional double ks = 4;
}

message DriftAlert {
  uint64 seq = 1;
  int64 at_ms = 2;
  string model = 3;
  uint64 version = 4;
  string summary_id = 5;
  string role = 6;
  string name = 7;
  // `psi` or `ks`.
  string metric = 8;
  double value = 9;
  double threshold = 10;
}

message DriftReport {
  string summary_id = 1;
  repeated FeatureDrift drift = 2;
  // The alerts this summary raised.
  repeated DriftAlert alerts = 3;
}

message ListDriftAlertsRequest {
  // Only this model's alerts, when set.
  string model = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message ListDriftAlertsResponse {
  repeated DriftAlert alerts = 1;
}

message GetVersionManifestRequest {
  string model = 1;
  uint64 version = 2;
}

// The envelope `hinagata.signature/v1`, plus the metadata bytes it covers.
message VersionManifest {
  string format = 1;
  string key_id = 2;
  // The manifest bytes exactly as signed.
  string manifest = 3;
  // Base64 of the 64-byte Ed25519 signature over `manifest`.
  string signature = 4;
  // The version's metadata bytes; their SHA-256 is the manifest's
  // `metadata_digest`.
  string metadata = 5;
}

// `min_*` alert below, `max_*` at or above; unset never alerts.
message QualityThresholds {
  optional double min_accuracy = 1;
  optional double min_auc = 2;
  optional double max_calibration_error = 3;
  optional double max_mae = 4;
  optional double max_rmse = 5;
}

message PutQualityThresholdsRequest {
  string model = 1;
  uint64 version = 2;
  QualityThresholds thresholds = 3;
}

message PutQualityThresholdsResponse {}

// One class's predicted probability against the labels, in 100 bins: bin
// `i` holds scores in `[i / 100, (i + 1) / 100)`, a score of 1 the last.
message ScoreHistogram {
  // Rows labeled with the class.
  repeated uint64 positive_counts = 1;
  // Rows labeled otherwise.
  repeated uint64 negative_counts = 2;
  // The sum of the class's predicted probability over each bin's rows.
  repeated double score_sums = 3;
}

message ConfusionRow {
  // Rows of one actual label, by predicted label, in label order.
  repeated uint64 counts = 1;
}

message ClassifierAggregate {
  repeated string labels = 1;
  // One row per actual label, in label order.
  repeated ConfusionRow confusion = 2;
  // Optional per class; AUC and calibration need one.
  map<string, ScoreHistogram> score_histograms = 3;
}

message RegressorAggregate {
  uint64 count = 1;
  double absolute_error_sum = 2;
  double squared_error_sum = 3;
}

message LabeledAggregate {
  // `hinagata.labeled-aggregate/v1`.
  string format = 1;
  // Unique per version; sending the same aggregate again is a no-op.
  string aggregate_id = 2;
  int64 window_start_ms = 3;
  int64 window_end_ms = 4;
  oneof kind {
    ClassifierAggregate classifier = 5;
    RegressorAggregate regressor = 6;
  }
}

message SubmitLabeledAggregateRequest {
  string model = 1;
  uint64 version = 2;
  LabeledAggregate aggregate = 3;
}

message QualityMetric {
  // `model`, or the class for `auc` and `calibration_error`.
  string name = 1;
  // `accuracy`, `auc`, `calibration_error`, `mae` or `rmse`.
  string metric = 2;
  double value = 3;
  // For `auc`: the most it can differ from the AUC of the raw scores.
  double tolerance = 4;
}

message QualityReport {
  string aggregate_id = 1;
  uint64 label_count = 2;
  repeated QualityMetric metrics = 3;
  // The alerts this aggregate raised.
  repeated DriftAlert alerts = 4;
}

message PromotionGates {
  // Each metric the version must record, at least at this value.
  map<string, double> min_metrics = 1;
  // No breaking signature change against any version in production.
  bool require_compatible_signature = 2;
  // The registry holds a signing key, so the manifest is signed.
  bool require_signed_manifest = 3;
}

message PutPromotionGatesRequest {
  string model = 1;
  PromotionGates gates = 2;
}

message GetPromotionGatesRequest {
  string model = 1;
}

message ImportVersionRequest {
  // The source registry's `GetVersionManifest` response.
  VersionManifest manifest = 1;
  bool validate_only = 2;
}

message ImportVersionResponse {
  // Unset with `validate_only`.
  Version version = 1;
}
