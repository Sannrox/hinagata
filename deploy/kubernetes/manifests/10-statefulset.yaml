# One replica: the embedded SQLite file and local artifacts live on the
# volume. The claim outlives the pod, a restart, an upgrade and an uninstall.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hinagata
  labels:
    app.kubernetes.io/name: hinagata
spec:
  serviceName: hinagata
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hinagata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hinagata
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hinagata
          image: "@IMAGE@"
          ports:
            - name: http
              containerPort: 7700
          env:
            - name: HINAGATA_LISTEN
              value: "0.0.0.0:7700"
            - name: HINAGATA_DB_PATH
              value: /data/hinagata.db
            - name: HINAGATA_ARTIFACT_DIR
              value: /data/artifacts
            - name: HINAGATA_STATIC_TOKEN_FILE
              value: /etc/hinagata/token.txt
            - name: HINAGATA_STATIC_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: hinagata-config
                  key: namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/hinagata
              readOnly: true
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Ready only when the registry database and the artifact store can do work.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: hinagata-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
